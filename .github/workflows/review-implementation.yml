name: Review implementation validation
on:
  push:
    branches: [feat/review-reliability-and-council]
    paths: [source-tools/apply-review.cjs, source-tools/finalize-review.cjs]
permissions:
  contents: write
concurrency:
  group: review-implementation
  cancel-in-progress: true
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/review-reliability-and-council
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply checked source edits
        run: |
          node source-tools/apply-review.cjs
          node source-tools/finalize-review.cjs
      - name: Check source and regression suite
        run: |
          for file in *.js *.cjs; do node --check "$file"; done
          node review-regressions.test.cjs
          node engine.test.cjs
          node character-mechanics.test.cjs
          node campaign-mechanics.test.cjs
          node world-mechanics.test.cjs
          node world-completion.test.cjs
          node viewport.test.cjs
      - name: Validate browser interactions
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
          node source-tools/review-browser.test.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: review-browser-evidence
          path: work/review-*.png
          if-no-files-found: ignore
      - name: Push only the tested implementation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- engine.js app.js campaign-ui.js index.html styles.css map-view.js launcher.py game-session.js experience-ui.js review-regressions.test.cjs .github/workflows/ci.yml RULES.md README.md
          if ! git diff --cached --quiet; then
            git commit -m 'feat: implement reviewed simulation fixes, saves and council controls'
            git push origin HEAD:feat/review-reliability-and-council
          fi
          git rev-parse HEAD
